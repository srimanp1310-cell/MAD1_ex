{% extends "staff/base_staff.html" %}
{% set active_page = 'profile' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h2 class="mb-4">My Profile</h2>
<div class="row">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="full_name">Full Name</label>
            <input class="form-control" type="text" id="full_name" name="full_name"
                   value="{{ user.full_name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" value="{{ user.email }}" disabled>
            <div class="form-text">Email cannot be changed.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="contact_number">Contact Number</label>
            <input class="form-control" type="text" id="contact_number" name="contact_number"
                   value="{{ user.staff_profile.contact_number or '' }}">
          </div>
          <hr>
          <div class="mb-3">
            <label class="form-label" for="password">New Password <small class="text-muted">(leave blank to keep current)</small></label>
            <input class="form-control" type="password" id="password" name="password" minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm New Password</label>
            <input class="form-control" type="password" id="confirm_password" name="confirm_password">
          </div>
          <button class="btn btn-primary" type="submit">Update Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
